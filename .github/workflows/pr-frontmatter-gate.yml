name: PR Frontmatter Gate

# ─────────────────────────────────────────────────────────────────────────────
# 為什麼有這條 gate（2026-07-05 誕生）
#
# GitHub UI 的 merge 按鈕 **不經過本地 .husky pre-commit / pre-push hook**。
# 2026-07-05 傍晚哲宇從 UI 連 merge 七篇 contributor PR，其中四篇的 YAML
# frontmatter 整包裹在 ``` code fence 裡（不是真 frontmatter，同一產出工具簽名），
# 直接落 main、打紅了 deploy.yml 的全站 article-health 健檢——但那是 **merge 後**
# 才發現，壞 frontmatter 已經在 main 上了。
#
# 這條 gate 把同樣的驗證前移到 PR **merge 前**：對 PR 改動的 knowledge/ 檔案跑
#   1) test-frontmatter.mjs（YAML 結構：title/desc/date/tags/subcategory/dup-slug/
#      翻譯檔 frontmatter，缺 --- 區塊會因缺 subcategory 而 hard-fail）
#   2) article-health.py --profile=pre-commit（缺 frontmatter 區塊 HARD +
#      cjk-punct / footnote-format / wikilink-target / format-structure）
# 任一不過 → job 紅 X + PR 留言說明怎麼修。跟本地 pre-commit 同一套規則，只是
# 搬到 CI 讓 UI-merge 也擋得住。
#
# ⚠️ 紅 X 本身只是「訊號」。要真正**擋住 merge 按鈕**，需在 repo Settings →
#    Branches → main branch protection 把本 check（"frontmatter-gate"）設為
#    required status check。那是 repo 治理設定（影響所有 contributor 的 merge
#    條件），留給哲宇拍板，本 workflow 不代設。
#
# Fork PR 權限：用 `pull_request`（非 pull_request_target），fork PR 的 token
# 是唯讀，所以留言步驟會失敗——已加 continue-on-error 優雅降級；紅 X（job exit
# code）不受 token 影響，永遠有效。跟 pr-review.yml 同一套 fork-safe 模式。
#
# ⚠️ 2026-08-13 校正：上面那句「紅 X 永遠有效」是對的，但不夠。紅 X 說「有問題」，
#    不說「問題是什麼、怎麼修」——而說明只活在那個對 fork PR 必定失敗的留言步驟裡。
#    後果實測：idlccp1984 連續 6 個 fork PR 敗在同一項（缺 subcategory），六次都
#    沒拿到任何說明。所以 gate 結果現在同時寫進 $GITHUB_STEP_SUMMARY（不需 token，
#    紅 X 一點就到）。留言步驟保留給同 repo PR，兩條管道並存。
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - 'knowledge/**'
      - 'scripts/core/sync.sh'
      - 'scripts/core/test-frontmatter.mjs'
      - 'scripts/tools/pr-changed-files.mjs'
      - 'src/config/languages.mjs'
      - 'scripts/tools/article-health.py'
      - 'scripts/tools/lib/article_health/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/markdown-cjk.test.mjs'
      # 設定檔自己與所有 marked 呼叫點也要觸發（2026-08-14 PR #1336 審查補）：
      # 少了這幾條，改 marked-cjk.mjs 或任何 renderer 的 PR 都不會跑到那道契約測試。
      - 'src/utils/marked-cjk.mjs'
      - 'src/utils/article-render.ts'
      - 'src/lib/semiont-*.ts'
      - 'tests/contributor-frontmatter-template.test.mjs'
      - '.github/workflows/pr-frontmatter-gate.yml'
      - 'scripts/tools/slug-gap-check.py'
      - 'scripts/tools/lang-sync/babel-preflight.py'

permissions:
  contents: read
  pull-requests: write

# 同一 PR 連推多次 → 只跑最新一次，取消排隊中的舊 run
concurrency:
  group: frontmatter-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontmatter-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (gray-matter for test-frontmatter)
        run: npm ci --prefer-offline --no-audit
      - name: Verify CJK Markdown parser contract
        run: npm run test:markdown

      - name: Validate contributor frontmatter template
        run: node --test tests/contributor-frontmatter-template.test.mjs

      # article-health.py 是純 stdlib，不需 pip install；ubuntu-latest 內建 python3

      - name: Detect PR-changed knowledge/ files
        id: files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/tools/pr-changed-files.mjs

      - name: Validate frontmatter (test-frontmatter + article-health)
        id: validate
        if: steps.files.outputs.count != '0'
        env:
          TWMD_VALIDATE_FILES_JSON: .pr-changed-files.json
        run: |
          set +e
          : > gate-result.txt
          STATUS="pass"

          # 1) test-frontmatter --strict：一次驗全部語系（它自己跨檔 aggregate errors，
          #    任一檔有 error → exit 1）。用 --strict 讓「缺 title/desc/date」也算 error——
          #    否則 fence-wrapped 的**翻譯檔**（不要求 subcategory）只會 warn 而漏抓
          #    （2026-07-05 實測 relaxed 模式放行壞 en 檔）。zh-TW 檔缺 --- 區塊本來就會
          #    因缺 subcategory hard-fail，--strict 只是把翻譯檔的漏洞一起補上。
          echo "── test-frontmatter.mjs --strict（YAML 結構：title/desc/date/tags/subcategory/dup-slug/翻譯檔）──" | tee -a gate-result.txt
          node scripts/core/test-frontmatter.mjs --strict 2>&1 | tee -a gate-result.txt
          [ "${PIPESTATUS[0]}" != "0" ] && STATUS="fail"
          echo "" | tee -a gate-result.txt

          # 2) article-health：**逐檔**跑 — 為了 PR 留言能逐檔標 🔴/✅ 歸屬（哪個檔壞）
          #    + 穩健。註（2026-07-05 收官更正）：多檔一次跑的 exit code 其實**有**正確
          #    aggregate（main() 是 sum(hard_count for all reports)，broken 在前在後都
          #    exit 1）——本檔早前的 commit 訊息說「只反映最後一檔」是量測失誤（只看了
          #    最後一檔的 Summary print 就誤判）。逐檔保留純為歸屬 UX，不是因為多檔會漏。
          echo "── article-health.py --profile=pre-commit（逐 zh-TW 檔，方便逐檔標示：缺 frontmatter 區塊 / cjk-punct / footnote / wikilink / format）──" | tee -a gate-result.txt
          if [ "$(node -e "console.log(require('./.pr-changed-files.json').zh_kn.length)")" != "0" ]; then
            while IFS= read -r -d '' f; do
              [ -z "$f" ] && continue
              OUT=$(python3 scripts/tools/article-health.py "$f" --profile=pre-commit 2>&1)
              if [ "$?" != "0" ]; then
                STATUS="fail"
                { echo "🔴 $f"; echo "$OUT" | grep -E "🔴|hard=[1-9]|缺 |對應" | head -6; } | tee -a gate-result.txt
              else
                echo "✅ $f" | tee -a gate-result.txt
              fi
            done < <(node -e "for (const f of require('./.pr-changed-files.json').zh_kn) process.stdout.write(f + '\0')")
          else
            echo "（無 zh-TW root 檔改動，此段跳過）" | tee -a gate-result.txt
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo ""
          echo "gate status = $STATUS"

          # ── Job Summary：fork PR 唯一到得了投稿者眼前的管道（2026-08-13）──
          # 下面那個留言步驟對 fork PR 永遠失敗（唯讀 token），已 continue-on-error
          # 優雅降級——但「優雅降級」降掉的正是**怎麼修**這件事本身。投稿者看到的
          # 只剩一個沒有理由的紅 X。實證：idlccp1984 連續 6 個 PR（#1304/#1323/
          # #1324/#1326/#1327/#1328）敗在同一項（缺 subcategory），六次都沒收到
          # 過任何一次說明，因為六次都是 fork PR。閘門診斷正確、輸出管道斷掉，
          # 於是同一個錯重複六次——這是 REFLEXES #52「immune system 沒在 fail loud
          # 比缺 immune system 更危險」的變體：它有 fail loud，只是沒對著人喊。
          # Job Summary 不需要任何 token 權限，且紅 X 一點就到這一頁。
          {
            if [ "$STATUS" = "pass" ]; then
              echo "## ✅ Frontmatter Gate 通過"
            else
              echo "## 🔴 Frontmatter Gate 未通過 — merge 前請先修"
            fi
            echo ""
            echo '```'
            cat gate-result.txt
            echo '```'
            if [ "$STATUS" != "pass" ]; then
              echo ""
              echo "### 最常見的修法"
              echo "- **缺 \`subcategory\`** → 對照 [\`docs/taxonomy/SUBCATEGORY.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/taxonomy/SUBCATEGORY.md) 找該分類的子分類補上。這是目前最常見的一項。"
              echo "- **YAML 被包在 \` \`\`\` \` code fence 裡**（不是真 frontmatter）→ 開頭與結尾的 \` \`\`\`yaml \` / \` \`\`\` \` 都換成 \`---\`，且必須貼在檔案最頂端。"
              echo "- **腳註格式 / 半形標點 / wikilink** → 本地跑 \`python3 scripts/tools/footnote-format-fix.py <檔> --apply\` 與 \`python3 scripts/tools/article-health.py <檔> --profile=pre-commit --fix\`，多數可自動修。"
              echo ""
              echo "修好 push 到同一個 PR 分支，這條 gate 會自動重跑。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 缺 slug 警告（2026-10-25 self-evolve，只警告不擋）──
      # 中文檔名、零譯文、沒登記 knowledge/_slug-map.json 的新文章，十二語翻譯會整篇
      # 跳過；偵測原本只住在隔天的 babel-preflight，投稿者自己按合併鈕那條路上沒人看得到
      # （MEMORY §神經迴路「缺 slug 的缺口在合併那刻產生」，三次＋兩夜手補）。判準直接呼叫
      # babel-preflight，兩支工具不會各說各話。缺 slug 不讓文章壞，只讓翻譯晚到，所以不擋。
      - name: Slug-map gap (warning only)
        if: steps.files.outputs.count != '0' && always()
        continue-on-error: true
        run: |
          OUT=$(python3 scripts/tools/slug-gap-check.py --changed-json .pr-changed-files.json --github)
          echo "$OUT"
          if echo "$OUT" | grep -q '^⚠️'; then
            {
              echo ""
              echo "## ⚠️ 翻譯佇列：有新文章還沒有英文 slug（不擋合併）"
              echo '```'
              echo "$OUT" | grep -v '^::warning'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment gate result on PR
        if: steps.files.outputs.count != '0' && always()
        continue-on-error: true # fork PR token 唯讀，留言失敗不影響紅 X
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.validate.outputs.status }}';
            if (!status) return; // validate 步驟沒跑（無檔改動）
            let result = '';
            try { result = fs.readFileSync('gate-result.txt', 'utf8'); } catch {}
            // GitHub comment 有長度上限，截斷保險
            if (result.length > 55000) result = result.slice(0, 55000) + '\n…（截斷，詳見 Actions log）';

            const pass = status === 'pass';
            const header = pass
              ? '## ✅ Frontmatter Gate 通過'
              : '## 🔴 Frontmatter Gate 未通過 — merge 前請先修';
            const fixHint = pass ? '' : [
              '',
              '### 最常見的修法',
              '- **YAML 被包在 ``` code fence 裡**（不是真 frontmatter）→ 把開頭的 ` ```yaml ` / ` ``` ` 換成 `---`，結尾 ` ``` ` 也換成 `---`。frontmatter 必須用 `---` 包住、貼在檔案最頂端。',
              '- **缺 `subcategory`** → 對照 [`docs/taxonomy/SUBCATEGORY.md`](../blob/main/docs/taxonomy/SUBCATEGORY.md) 該分類的子分類補上。',
              '- **腳註格式 / 半形標點 / wikilink** → 本地跑 `python3 scripts/tools/article-health.py <檔> --profile=pre-commit --fix` 多數可自動修。',
              '',
              '修好 push 到同一個 PR 分支，這條 gate 會自動重跑。',
            ].join('\n');

            const body = `${header}\n\n\`\`\`\n${result.trim()}\n\`\`\`${fixHint}\n\n---\n*Taiwan.md Frontmatter Gate • 把本地 pre-commit 的 frontmatter 驗證前移到 PR，擋住 UI-merge 繞過 hook*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot = comments.find(c => c.body.includes('Taiwan.md Frontmatter Gate'));
            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: bot.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail the check if frontmatter is broken
        if: steps.validate.outputs.status == 'fail'
        run: |
          echo "❌ Frontmatter gate 未通過——見上方步驟輸出與 PR 留言。"
          echo "   本地重現：TWMD_VALIDATE_FILES=\"<改動檔>\" node scripts/core/test-frontmatter.mjs"
          echo "            python3 scripts/tools/article-health.py <zh-TW 檔> --profile=pre-commit"
          exit 1
