name: Python tests

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/translation.yml"
      - ".github/workflows/i18n-smoke-test.yml"
      - ".github/workflows/pr-frontmatter-gate.yml"
      - ".github/workflows/pr-review.yml"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/translation-check.yml"
      - ".husky/pre-commit"
      - "CONTRIBUTING.md"
      - "package.json"
      - "public/start.sh"
      - "requirements-test.txt"
      - "scripts/core/build-latest.mjs"
      - "scripts/core/generate-contributors-data.js"
      - "scripts/core/test-frontmatter.mjs"
      - "scripts/**/*.py"
      - "scripts/tools/article-health.config.toml"
      - "scripts/tools/compare-language-registries.mjs"
      - "scripts/tools/bulk-pr-analyze.sh"
      - "scripts/tools/review-pr.sh"
      - "src/config/languages.mjs"
      - "src/config/languages.ts"
      - "src/pages/**/*.astro"
      - "tests/**/*.py"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/translation.yml"
      - ".github/workflows/i18n-smoke-test.yml"
      - ".github/workflows/pr-frontmatter-gate.yml"
      - ".github/workflows/pr-review.yml"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/translation-check.yml"
      - ".husky/pre-commit"
      - "CONTRIBUTING.md"
      - "package.json"
      - "public/start.sh"
      - "requirements-test.txt"
      - "scripts/core/build-latest.mjs"
      - "scripts/core/generate-contributors-data.js"
      - "scripts/core/test-frontmatter.mjs"
      - "scripts/**/*.py"
      - "scripts/tools/article-health.config.toml"
      - "scripts/tools/compare-language-registries.mjs"
      - "scripts/tools/bulk-pr-analyze.sh"
      - "scripts/tools/review-pr.sh"
      - "src/config/languages.mjs"
      - "src/config/languages.ts"
      - "src/pages/**/*.astro"
      - "tests/**/*.py"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        run: python -m pytest tests -q
