name: Translation PR Check

on:
  pull_request:
    paths:
      - 'knowledge/en/**'
      - 'knowledge/es/**'
      - 'knowledge/ja/**'
      - 'knowledge/ko/**'
      - 'knowledge/fr/**'
      - 'knowledge/vi/**'
      - 'knowledge/id/**'
      - 'knowledge/pt/**'
      - 'knowledge/hi/**'
      - 'knowledge/ar/**'
      - 'knowledge/ru/**'

jobs:
  check-translation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Auto-label translation PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['translation']
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning('Skipping auto-label due token scope for forked PR');
              } else {
                throw error;
              }
            }

      - name: Check translation format
        run: |
          echo "🔍 Checking translation files..."
          
          ERRORS=0
          ACTIVE_LANGS=$(node --input-type=module -e "import { ENABLED_LANGUAGE_CODES } from './src/config/languages.mjs'; console.log(ENABLED_LANGUAGE_CODES.filter((code) => code !== 'zh-TW').join('|'))")
          
          # Get changed files under enabled translation directories.
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- 'knowledge/' 2>/dev/null | grep -E "^knowledge/($ACTIVE_LANGS)/" || true)
          
          if [ -z "$FILES" ]; then
            echo "No translation files changed."
            exit 0
          fi
          
          for FILE in $FILES; do
            echo ""
            echo "📄 Checking: $FILE"
            
            if [ ! -f "$FILE" ]; then
              echo "  ⚠️ File not found (deleted?), skipping"
              continue
            fi
            
            # Check frontmatter exists
            if ! head -1 "$FILE" | grep -q '^---$'; then
              echo "  ❌ Missing frontmatter (must start with ---)"
              ERRORS=$((ERRORS + 1))
            fi

            FRONTMATTER=$(awk '/^---$/{n++; next} n==1{print} n>=2{exit}' "$FILE")
            
            # Check required frontmatter fields
            if ! printf '%s\n' "$FRONTMATTER" | grep -q "^title:"; then
              echo "  ❌ Missing title in frontmatter"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✅ Has title"
            fi
            
            # Check description in frontmatter
            if ! printf '%s\n' "$FRONTMATTER" | grep -q "^description:"; then
              echo "  ⚠️ Missing description (recommended)"
            else
              echo "  ✅ Has description"
            fi
            
            # Check category in frontmatter
            if ! printf '%s\n' "$FRONTMATTER" | grep -q "^category:"; then
              echo "  ⚠️ Missing category (recommended)"
            fi

            if ! printf '%s\n' "$FRONTMATTER" | grep -q "^translatedFrom:"; then
              echo "  ❌ Missing translatedFrom in frontmatter"
              echo "     Add the zh-TW source path, for example: translatedFrom: 'Food/珍珠奶茶.md'"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check minimum content length (at least 20 lines for a reviewable article)
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -lt 20 ]; then
              echo "  ❌ Too short ($LINES lines, minimum 20)"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✅ Length OK ($LINES lines)"
            fi
            
            # Check file is in correct directory structure
            LANG=$(echo "$FILE" | sed 's|knowledge/\([^/]*\)/.*|\1|')
            if ! echo "$LANG" | grep -qE "^($ACTIVE_LANGS)$"; then
              echo "  ❌ $LANG is not an enabled language in src/config/languages.mjs"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✅ Language: $LANG"
            fi
            
            # Check for Chinese source exists
            CATEGORY=$(echo "$FILE" | sed "s|knowledge/$LANG/\([^/]*\)/.*|\1|")
            echo "  📂 Category: $CATEGORY"
            
            # 2026-05-01 γ-late5 v3：whitelist 文章路徑（critique context）
            # 這些文章本身在討論「Chinese Taipei / Province of China」這個爭議
            # 用詞，必然會引用該詞。lint 不該誤把它們判成 endorsement。
            BASENAME=$(basename "$FILE" .md)
            CRITIQUE_FILES="taiwan-in-international-standards taiwans-labeling-in-international-standards taiwan-baseball-culture baseball-culture chi-cheng-flying-antelope taiwan-international-trade-policy taiwan-diplomatic-allies-and-international-relations chinese-taipei taiwan-sports-olympics invisible-nation taitung-county national-holidays tasa-taiwan-space-agency"
            IS_CRITIQUE=0
            for cf in $CRITIQUE_FILES; do
              [ "$BASENAME" = "$cf" ] && IS_CRITIQUE=1 && break
            done

            # Warn about potential issues — skip URL lines + critique-context files
            if [ "$IS_CRITIQUE" = "0" ] && grep -iE "province of china|part of china|chinese taipei" "$FILE" 2>/dev/null | grep -vE "https?://" | grep -q .; then
              echo "  ❌ Contains problematic Taiwan reference (in prose, not source URL)"
              ERRORS=$((ERRORS + 1))
            fi
            
            if grep -qi "aborigines" "$FILE" 2>/dev/null; then
              echo "  ⚠️ Uses 'aborigines' — prefer 'Indigenous peoples'"
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━"
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Found $ERRORS error(s). Fix the items above, then push the updated files."
            exit 1
          else
            echo "✅ All translation checks passed."
          fi
