name: zz CI speed bench (temporary, branch only)

# 暫時的對照實驗，只在 ci-speed 分支上跑，合併進 main 前刪掉。
# 照抄 deploy.yml 的 build job，在 ARM 與 x86 各跑兩次，
# 量每一步的時間、產物清單（路徑＋大小），以及上傳壓縮等級的影響。
# 不碰 deploy-pages，不會部署。

on:
  push:
    branches: [claude/stoic-wright-266ae6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
        variant: [old, new]
        rep: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Restore file mtimes from git history
        run: python3 scripts/ci/restore-mtime.py --verify-min-ratio 0.9
      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
      - name: Verify CJK Markdown parser contract
        run: npm run test:markdown
      - name: Validate frontmatter (changed files)
        run: node scripts/core/test-frontmatter.mjs --ci
      - name: Validate article health (SSOT, full sweep)
        run: python3 scripts/tools/article-health.py --all --profile=ci-deploy --quiet

      - name: Use the pre-change status.py (old variant)
        if: matrix.variant == 'old'
        run: git show 171014919d:scripts/tools/lang-sync/status.py > scripts/tools/lang-sync/status.py && git diff --stat
      - name: Restore OG image cache
        uses: actions/cache/restore@v5
        with:
          path: public/og-images
          key: og-images-${{ hashFiles('scripts/core/generate-og-images.mjs', 'public/favicon.png') }}-${{ github.run_id }}
          restore-keys: |
            og-images-${{ hashFiles('scripts/core/generate-og-images.mjs', 'public/favicon.png') }}-
            og-images-
      - name: Sync OG cache for renamed articles
        timeout-minutes: 2
        run: node scripts/tools/og-rename-sync.mjs --since '30 days ago'

      - name: Build
        env:
          LANG_SYNC_SKIP_DIFFSTAT: '1'
          PUBLIC_FEEDBACK_MODE: ${{ vars.PUBLIC_FEEDBACK_MODE }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_FEEDBACK_PROVIDERS: ${{ vars.PUBLIC_FEEDBACK_PROVIDERS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build 2>&1 | tee /tmp/build.log | grep -E '^> taiwan-md@|page\(s\) built|Completed in' ; test ${PIPESTATUS[0]} -eq 0

      - name: Prebuild step timestamps
        run: grep -nE '^> taiwan-md@' /tmp/build.log | head -50

      - name: Manifest
        run: |
          cd dist
          find . -type f -printf '%P\t%s\n' | LC_ALL=C sort > /tmp/manifest.tsv
          echo "files=$(wc -l < /tmp/manifest.tsv) html=$(grep -c '\.html	' /tmp/manifest.tsv) bytes=$(awk -F'\t' '{s+=$2} END {print s}' /tmp/manifest.tsv)"
      - uses: actions/upload-artifact@v5
        with:
          name: manifest2-${{ matrix.variant }}-${{ matrix.rep }}
          path: /tmp/manifest.tsv
          retention-days: 3

