  origin: 這個詞在台灣進入公共討論，有一個日期：2026 年 6 月 29 日自由時報報導，國美館貼文用「上新啦～」宣傳科博館特展，網友在 Threads 檢舉，近 3 千個愛心，有人問「上新」到底是什麼，館方隨即更正為「最新展覽來囉～」。詞的來歷本輪沒有查到任何來源。
  fork_cause: 未查得。
