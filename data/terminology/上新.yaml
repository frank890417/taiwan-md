status: emerging
notes: |
  誠信標註：「源自電商上架」是常見直覺，本輪沒有來源支持，不寫入。
  四型誤判都未命中，也都未排除。台灣對應是館方的整句改寫，不是一對一的詞，
  本條的價值在記下公部門被檢舉後改字這個時間點。
