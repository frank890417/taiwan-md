id: 仿冒品
category: daily
subcategory: 日常生活
fork_type: B

display:
  taiwan: 仿冒品
  china: 假貨

notes: |
  ⚠️ 查證分歧誠信標註（2026-10-24 新增，待查證）：讀者楊喬梓在站上回報
  「假貨來自閩南語翻華文」，也就是主張「假貨」是台灣本有的詞、不是中國用語
  （[issue #1902](https://github.com/frank890417/taiwan-md/issues/1902)）。

  這則挑戰指向的正是本條唯一的主張——把「假貨」放在 `display.china` 這一格，
  等於告訴讀者那是對面的講法。而本條唯一的來源是一本 1997 年的《大陸用語檢索
  手冊》，對這種「這個詞屬於誰」的斷定來說偏薄。

  這一型的錯如果真的錯了，方向特別要緊：**把台灣自己的詞標成中國用語，是這個
  詞庫存在目的的反面**。所以在查清楚之前這裡不改判定，只把爭議記下來：讀本條的
  人請把「假貨 = 中國用語」當作待查證的標示，不是已確立的事實。

  🚫 已驗過的死路（2026-10-24 maintainer-daily，寫下來是為了不讓下一班再走一次）：
  教育部《臺灣台語常用詞辭典》**查無「假貨」詞條**（精確與部分比對都 0 筆）。
  但這不構成否證——辭典沒收不等於語言裡沒有，而且同辭典收了「賊仔貨」
  （tsha̍t-á-huè，指贓物，語意不同，不是本條要找的詞）。「貨」讀 -huè 的寫法
  與辭典一致。所以辭典這條路只能排除「辭典可直接定案」，不能排除讀者的說法。

  ✅ 查證進度（2026-11-05 用語趨勢月班）：讀者說法裡「台語本有」這一半成立。
  《臺日大辭典》（1931-32）收「假貨」ke2-he3，日文釋義「贋物」（編號 16545，掃描頁 420）；
  《臺灣教會公報》1894 到 1965 年有多筆 ké-hòe／ké-hè 用例，前幾筆是賣假東西騙人的
  商業語境。《重編國語辭典修訂本》也收「假貨」，釋義「偽造品」，沒有地區標注。
  這些都比 1997 年手冊早。還沒證明的是借用方向：華語「假貨」是否真的從台語來，
  也可能是獨立構詞；戰後台灣華文報刊的使用也還沒查到。
  判定這一格本輪不動，是否移出 display.china 已送 OBSERVER-QUEUE。

status: stable

# 上面 notes 的誠信標註是給讀者看的散文；這一格是給儀器看的欠條。
# 讀取工具：scripts/tools/terminology-pending-verification.py
pending_verification:
  question: 台語本有已查實（見 notes），未決的是華語「假貨」的借用方向，以及戰後台灣華文報刊是否長期自用。
  needs: |
    要能分辨「台灣本有」與「中國傳入」，需要台語文獻與早期台灣華文語料，不是
    LLM 直覺或單一辭典查詢能收的（REFLEXES #16 sovereignty 延伸：審查主權敏感
    的譯名與稱呼時，模型預設拿中國語料當基準）。可走的三條：
    (a) 台語文獻的用字紀錄——《臺日大辭典》（1931-32）、《廈英大辭典》等日治期
        辭書有沒有收「假貨」或同義的 ké-/kà- 構詞；
    (b) 早期台灣華文語料——1945-1990 的台灣報刊資料庫檢索「假貨」，若戰後台灣
        報紙長期自用，則「1997 手冊把它列為大陸用語」本身就該被重估；
    (c) 教育部《重編國語辭典修訂本》對「假貨」的收錄與標注。
    教育部臺灣台語辭典已查無此條（見 notes 的死路紀錄），不必重查。
    2026-11-05 進度：(a)(c) 已完成，只剩 (b)。《廈英大辭典》資料庫檢索 0 筆，但它是廈門話辭書，對台灣沒有否證力。
  locations:
    - '教育部《臺灣台語常用詞辭典》 https://sutian.moe.edu.tw/ — 2026-10-24 查無「假貨」，已排除'
    - '《臺日大辭典》（小川尚義編，1931-32）台語辭書數位化：臺灣總督府臺灣日日新報社；台語文數位典藏資料庫'
    - '國立公共資訊圖書館／國家圖書館 台灣早期報刊資料庫（戰後台灣華文語料，用於 (b)）'
  issue: 'https://github.com/frank890417/taiwan-md/issues/1902'
  opened: '2026-10-24'
  observer_queue: '非佇列項——這條缺的是語料查詢不是人的授權，收件席位 twmd-terminology-trends-monthly（下次 11-05）'

