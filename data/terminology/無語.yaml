id: speechless
category: daily
subcategory: 日常用語
fork_type: B

display:
  taiwan: 無言
  china: 無語

english: speechless / at a loss for words

etymology:
  origin: 表達「不知道該說什麼」的情緒詞
  taiwan_path: 台灣口語為「無言」，1990-2000s 已是日常用法（蘇打綠〈問蒼天〉「無語」是古文用法，與當代中國口語不同）
  china_path: 中國網路興起後「無語」成主流，「無語凝噎」古文用法被通俗化為日常語氣詞
  fork_point: '~2010s'
  fork_cause: 中國微博 / B 站擴散，年輕台灣人在中國平台接觸後反輸入

usage:
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「無語問蒼天」是台灣老梗（蘇打綠歌詞），保留古文用法

notes: |
  OP 多次強調這是文化滲透最徹底的詞之一：
  「明明台灣口語就是『無言』，現在變成無語」
  留言區多人附和「現在一堆學生每天都在無語，我真的頭很痛」。

  ⚠️ 查證分歧誠信標註（2026-08-28 新增，待查證）：一位讀者在站上回報，
  白色恐怖受難者郭淑姿的日記裡就有「無語」的用法，主張這個詞台灣本來就有，
  不是 2010 年代從中國反輸入的（[issue #1609](https://github.com/frank890417/taiwan-md/issues/1609)）。

  這則挑戰指向的是本條最強的那個主張——上面的 fork_point 寫 ~2010s、
  fork_cause 寫「中國微博／B 站擴散後反輸入」。而本條目前唯一的來源是一則
  Threads 留言串，對這種強度的斷代主張來說偏薄；讀者舉的則是一份時間早了
  七十年的台灣一手文本。

  日記原文尚未查證，所以這裡不改判定，只把爭議記下來：本條的斷代主張
  目前處於「被一份一手史料挑戰、尚未核對」的狀態。讀本條的人請把
  fork_point 當作待驗證的推測，不是已確立的事實。查證工作排進用語趨勢 routine。

  📍 出處已定位（2026-08-31 maintainer-am，判定仍不動）：郭淑姿是白色恐怖
  受難者葉盛吉的遺孀，日記由國家人權博物館出版為《郭淑姿日記》第一冊、第二冊，
  這是核對全文需要調閱的對象。目前找得到的最詳細二手處理是黃文源在風傳媒的
  投書，該文引述 1951 年起日記反覆出現的情緒詞是「無聊」（原文作「不聊」），
  全文未見「無語」。這是一條線索不是結論——一篇投書掃不到，不等於兩冊日記裡
  沒有；要推翻或坐實這個斷代，仍須調閱全文逐字核對。兩種可能都還開著：
  讀者記憶中的詞可能是「無聊」，也可能「無語」確實出現在投書沒引到的段落。

  📍 檔案落點縮小（2026-09-14 maintainer-am，判定仍不動）：原件不只有出版品那一條路。
  郭淑姿留下日記四本與筆記雜錄二件，年代 1944-1953，收在〈葉盛吉文書〉之中；
  葉光毅教授 2009 年提供中央研究院臺灣史研究所檔案館數位典藏，2015 年整編完成，
  已上「臺灣史檔案資源系統」開放目錄查詢，數位影像**到館調閱**（線上無全文）。
  出版品則分冊為《郭淑姿日記（一）1944-1950》與《郭淑姿日記（二）1951-1953》（2020）。
  這件事縮小了查證範圍：黃文源投書引的「無聊／不聊」出自 1951 年起的段落，
  落在**第二冊**；要坐實或推翻讀者的說法，第二冊是第一順位，第一冊涵蓋 1944-1950 為次順位。
  仍未核對全文，判定不動。

  📍 查證路徑大幅變短（2026-09-24 maintainer-am，判定仍不動）：上一則寫「數位影像須到館調閱、
  線上無全文」——那句話對檔案館那條路是對的，但漏了另一條。《郭淑姿日記》全文已經收進
  中研院臺史所的「臺灣日記知識庫」，是該庫第 21 種，1944-1953 共 904 則、約 34 萬字，
  附手稿影像，而且該庫提供**全文檢索**。這把查證成本從「跑一趟檔案館、翻兩冊實體書」
  降到「檢索一個詞」。
  **剩下的卡點只有一個，而且是 AI 過不去的那種**：全文需要登入帳號，
  而註冊帳號是人類的動作，不是我可以代勞的。所以這條到今天為止，
  缺的不再是線索、不再是範圍、也不再是力氣——缺的是一次登入。
  判定一個字都沒動，fork_point 仍是「被一份一手史料挑戰、尚未核對」。

status: stable

# 上面 notes 的誠信標註是給讀者看的散文；這一格是給儀器看的欠條。
# 兩者並存的理由：`⚠️ 查證分歧誠信標註` 那串字在詞庫裡多數代表「查證做完了，
# 標註記錄結論」，拿它當「還沒查」的記號會撈出 6/7 假陽性（2026-09-13 實測）。
# 讀取工具：scripts/tools/terminology-pending-verification.py
pending_verification:
  question: 「無語」在台灣是本有用法，還是 2010 年代從中國反輸入？本條 fork_point／fork_cause 目前寫後者，唯一來源是一則 Threads 留言串。
  needs: 對《郭淑姿日記》全文檢索「無語」與「無聊」各一次。2026-09-24 起這件事不必再調閱實體書——本日記全文已收進中研院臺史所「臺灣日記知識庫」（第 21 種，1944-1953，904 則、約 34 萬字，附手稿影像），該庫提供全文檢索。**卡點只剩一個：全文需登入帳號，AI 不得自行註冊帳號，需由人完成。**登入後第一順位仍是 1951 年起的段落（黃文源風傳媒投書引的「無聊／不聊」出自該處），但全文檢索可一次涵蓋兩冊，原本的分冊優先序失去意義。二手線索只見「無聊」未見「無語」，但投書只引它要用的段落，掃不到不等於沒有。
  locations:
    - '⭐ 中研院臺史所「臺灣日記知識庫」https://taco.ith.sinica.edu.tw/tdk/ — 收錄《郭淑姿日記》全文 904 則約 34 萬字＋手稿影像，提供全文檢索；需登入帳號（2026-09-24 maintainer-am 查得，最省力的一條路）'
    - '🚫 已驗過的死路（2026-09-27 maintainer-am，寫下來是為了不讓下一班再走一次）：(a) 該站是 MediaWiki，但 `api.php` 對匿名身分同樣回「權限錯誤」，連 `action=query&meta=siteinfo` 這種最簡單的呼叫都擋（回傳頁面 `wgUserName: null`／`wgUserGroups: ["*"]`）——正控制通過，所以不是查詢寫錯，是整層擋讀，沒有匿名 API 繞道；(b) 頁面帶 `noindex,nofollow`，搜尋引擎不會有快取或摘要可撈；(c) 國家人權博物館與開放博物館側沒有找到這兩冊的全文。三條加起來的意思是：這件事只剩「一次登入」這一種解，不會再有換路的版本'
    - '🚫 2026-11-05 用語趨勢月班：知識庫對 WebFetch、curl、瀏覽器都回 HTTP 403（Cloudbric 防火牆），卡在登入頁之前，原因未知。詞形層另有線索：《臺日大辭典》收「無言無語」，《重編》有詞目「無語」，都是沉默義；2000 年前「我無語了」這種語氣用法仍未找到，爭議應落在語用層'
    - '國家人權博物館出版：《郭淑姿日記（一）1944-1950》／《郭淑姿日記（二）1951-1953》（2020）'
    - '中研院臺史所檔案館〈葉盛吉文書〉臺灣史檔案資源系統 https://archives.ith.sinica.edu.tw/collections_con.php?no=292（目錄線上查詢，數位影像到館調閱）'
  issue: 'https://github.com/frank890417/taiwan-md/issues/1609'
  opened: '2026-08-28'
