id: speechless
category: daily
subcategory: 日常用語
fork_type: B

display:
  taiwan: 無言
  china: 無語

english: speechless / at a loss for words

etymology:
  origin: 表達「不知道該說什麼」的情緒詞
  taiwan_path: 台灣口語為「無言」，1990-2000s 已是日常用法（蘇打綠〈問蒼天〉「無語」是古文用法，與當代中國口語不同）
  china_path: 中國網路興起後「無語」成主流，「無語凝噎」古文用法被通俗化為日常語氣詞
  fork_point: '~2010s'
  fork_cause: 中國微博 / B 站擴散，年輕台灣人在中國平台接觸後反輸入

usage:
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「無語問蒼天」是台灣老梗（蘇打綠歌詞），保留古文用法

notes: |
  OP 多次強調這是文化滲透最徹底的詞之一：
  「明明台灣口語就是『無言』，現在變成無語」
  留言區多人附和「現在一堆學生每天都在無語，我真的頭很痛」。

  ⚠️ 查證分歧誠信標註（2026-08-28 新增，待查證）：一位讀者在站上回報，
  白色恐怖受難者郭淑姿的日記裡就有「無語」的用法，主張這個詞台灣本來就有，
  不是 2010 年代從中國反輸入的（[issue #1609](https://github.com/frank890417/taiwan-md/issues/1609)）。

  這則挑戰指向的是本條最強的那個主張——上面的 fork_point 寫 ~2010s、
  fork_cause 寫「中國微博／B 站擴散後反輸入」。而本條目前唯一的來源是一則
  Threads 留言串，對這種強度的斷代主張來說偏薄；讀者舉的則是一份時間早了
  七十年的台灣一手文本。

  日記原文尚未查證，所以這裡不改判定，只把爭議記下來：本條的斷代主張
  目前處於「被一份一手史料挑戰、尚未核對」的狀態。讀本條的人請把
  fork_point 當作待驗證的推測，不是已確立的事實。查證工作排進用語趨勢 routine。

  📍 出處已定位（2026-08-31 maintainer-am，判定仍不動）：郭淑姿是白色恐怖
  受難者葉盛吉的遺孀，日記由國家人權博物館出版為《郭淑姿日記》第一冊、第二冊，
  這是核對全文需要調閱的對象。目前找得到的最詳細二手處理是黃文源在風傳媒的
  投書，該文引述 1951 年起日記反覆出現的情緒詞是「無聊」（原文作「不聊」），
  全文未見「無語」。這是一條線索不是結論——一篇投書掃不到，不等於兩冊日記裡
  沒有；要推翻或坐實這個斷代，仍須調閱全文逐字核對。兩種可能都還開著：
  讀者記憶中的詞可能是「無聊」，也可能「無語」確實出現在投書沒引到的段落。

status: stable

# 上面 notes 的誠信標註是給讀者看的散文；這一格是給儀器看的欠條。
# 兩者並存的理由：`⚠️ 查證分歧誠信標註` 那串字在詞庫裡多數代表「查證做完了，
# 標註記錄結論」，拿它當「還沒查」的記號會撈出 6/7 假陽性（2026-09-13 實測）。
# 讀取工具：scripts/tools/terminology-pending-verification.py
pending_verification:
  question: 「無語」在台灣是本有用法，還是 2010 年代從中國反輸入？本條 fork_point／fork_cause 目前寫後者，唯一來源是一則 Threads 留言串。
  needs: 調閱國家人權博物館出版的《郭淑姿日記》第一冊、第二冊全文逐字核對。二手線索（黃文源風傳媒投書）只見「無聊」（原文作「不聊」）未見「無語」，但投書只引它要用的段落，掃不到不等於沒有。
  issue: 'https://github.com/frank890417/taiwan-md/issues/1609'
  opened: '2026-08-28'

