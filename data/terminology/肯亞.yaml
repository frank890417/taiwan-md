id: 肯亞
category: proper-noun
fork_type: orthographic

display:
  taiwan: 肯亞
  china: 肯尼亞

notes: |
  原本台灣與中國兩欄填反了：台灣欄填「肯尼亞」、中國欄填「肯亞」。外交部非洲地區國家頁寫「肯亞共和國」，同頁 3 處都是「肯亞」、0 處「肯尼亞」；維基百科條目的轉換標記寫 `zh-cn:肯尼亚; zh-tw:肯亞`。已對調（issue #2025 同型掃描）。

