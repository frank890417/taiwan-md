id: 莫三鼻克
category: proper-noun
fork_type: orthographic

display:
  taiwan: 莫三比克
  china: 莫桑比克

notes: |
  原本台灣與中國兩欄填反了：台灣欄填「莫桑比克」、中國欄填「莫三鼻克」。外交部非洲地區國家頁寫「莫三比克共和國」，同頁 3 處都是「莫三比克」、0 處「莫桑比克」；維基百科條目的轉換標記寫 `zh-hans:莫桑比克; zh-tw:莫三比克`。台灣欄改成外交部現行用字「莫三比克」；本檔 id 沿用舊譯「莫三鼻克」未改檔名，那是台灣的舊用字（維基記「舊譯作莫三鼻給」），不是中國用語。已對調（issue #2025 同型掃描）。

