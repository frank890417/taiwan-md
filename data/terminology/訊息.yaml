id: 訊息
category: daily
subcategory: 日常生活
fork_type: F
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）

display:
  taiwan: 訊息
  china: 消息

etymology:
  origin: |
    「消息」是漢語固有詞，兩岸共用，不是 1949 之後才從中國傳過來的說法。分歧不在詞本身，
    在它涵蓋的範圍：指「即時通訊軟體裡收到的那一則」時，台灣習慣講「訊息」，中國習慣講「消息」。
  taiwan_path: |
    「消息」在台灣是通行的正統國語——教育部《重編國語辭典修訂本》除了「消息」本條，另收
    「好消息」「小道消息」「走漏消息」「杳無消息」「內幕消息」「馬路消息」「探消息」「透消息」
    「春消息」「與時消息」「消息兒」等詞目，日常與新聞語境天天在用。台灣另外把
    「訊息」發展成電子通訊語境的主要說法（傳訊息、已讀訊息、系統訊息）。
  china_path: 中國在即時通訊與通知語境同樣用「消息」（微信消息、未讀消息），沒有把「訊息」發展成該語境的主用詞。
  fork_cause: 適用範疇分歧，不是詞彙替換——兩岸都用「消息」，差別在電子通訊語境台灣改用「訊息」。

usage:
  taiwan_formal: true
  taiwan_casual: true
  exceptions: |
    「消息」本身是台灣的正統國語，不屬中國用語，教育部《重編國語辭典修訂本》正文收錄本條及
    十餘個以它構成的詞目（好消息、小道消息、走漏消息、杳無消息⋯⋯）。只有在指即時通訊軟體的
    單則訊息時（「我傳一則消息給你」），台灣較少這樣講，習慣說「訊息」。看到「消息」不必改。

status: stable

notes: |
  誤判翻案案例（issue #1733，讀者 J L 回報）：本條原標 fork_type B「1949 分流」，頁面因此對
  「消息」產生「是中國大陸的常見說法」這種整詞級斷言。讀者引教育部《重編國語辭典修訂本》指出
  「消息」表「音信、訊息」的用法古已有之（並舉晚清《文明小史》第三回為例），不是大陸用語。
  查證屬實：MoE 辭典正文確實收「消息」本條（ID 106393）與十餘個衍生詞目。已改 F「同詞不同語感」
  並補 usage.exceptions 標明適用範疇，讓頁面不再對整個詞過度宣稱。
  跟「串流」「踩雷」「痛點」同屬方向被搞反的一類——差別在這次是我們自己的資料把方向標錯了。

